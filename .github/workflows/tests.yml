name: Tests
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify RabbitMQ message persistence across container recreation
        run: python3 scripts/check_rabbitmq_persistence.py
      - name: Check style, tests with PostgreSQL and RabbitMQ, and migration drift
        run: >-
          docker compose --profile test run --build --rm tests
          sh -c "ruff check --no-cache . && ruff format --no-cache --check . && pytest -q -p no:cacheprovider && alembic check"
      - name: Show service logs after failure
        if: failure()
        run: docker compose logs
      - name: Stop test stack
        if: always()
        run: docker compose --profile test down --volumes
